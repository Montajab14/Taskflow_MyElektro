services:
  # -----------------------------------------------------------
  # 1. Base de données MongoDB
  # -----------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: taskflow-mongodb
    restart: always
    ports:
      # MONGO_PORT=27019 docker compose up si 27017 est déjà pris sur la machine
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret123
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo_data:/data/db
    networks:
      - taskflow-network

  # -----------------------------------------------------------
  # 2. Interface Web Mongo Express (visualiser la BDD sur le port 8081)
  # -----------------------------------------------------------
  mongo-express:
    image: mongo-express:latest
    container_name: taskflow-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: secret123
      ME_CONFIG_MONGODB_URL: mongodb://admin:secret123@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb
    networks:
      - taskflow-network

  # -----------------------------------------------------------
  # 3. Application Node.js (Backend TaskFlow)
  # -----------------------------------------------------------
  backend:
    build: .
    container_name: taskflow-backend
    restart: always
    ports:
      # Même port qu'en local (npm start) : le front est sur http://localhost:3000
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://admin:secret123@mongodb:27017/taskflow?authSource=admin
    volumes:
      # Synchronisation du code en direct (hot-reload)
      - ./src:/app/src
    depends_on:
      - mongodb
    networks:
      - taskflow-network

  # -----------------------------------------------------------
  # 4. API REST TaskFlow (Express + MongoDB, dossier backend/)
  # -----------------------------------------------------------
  api:
    build: ./backend
    container_name: taskflow-api
    restart: always
    ports:
      # Même port qu'en local (npm run dev) : le front appelle http://localhost:3001/api
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://admin:secret123@mongodb:27017/taskflow?authSource=admin
      # Lu depuis le fichier .env à la racine (jamais versionné) : sans lui, seule l'API refuse de démarrer
      - JWT_SECRET=${JWT_SECRET:-}
      - CORS_ORIGIN=http://localhost:3000,http://localhost:5173
    depends_on:
      - mongodb
    networks:
      - taskflow-network

# -----------------------------------------------------------
# Volumes persistants & Réseau partagé
# -----------------------------------------------------------
volumes:
  mongo_data:
    driver: local

networks:
  taskflow-network:
    driver: bridge
