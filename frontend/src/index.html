<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow — Authentification</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <!-- Effets de fond lumineux -->
        <div class="bg-glow glow-1"></div>
        <div class="bg-glow glow-2"></div>

        <div class="auth-card">
            <!-- Entête / Logo -->
            <header class="auth-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                        </svg>
                    </div>
                    <span class="logo-text">Task<span>Flow</span></span>
                </div>
                <h1 id="form-title">Bienvenue sur TaskFlow</h1>
                <p id="form-subtitle">Gérez vos tâches et projets en toute simplicité.</p>
            </header>

            <!-- Sélecteur d'onglets (Login / Inscription) -->
            <div class="tab-switcher" role="tablist">
                <button class="tab-btn active" id="tab-login" role="tab" aria-selected="true" type="button">
                    Connexion
                </button>
                <button class="tab-btn" id="tab-register" role="tab" aria-selected="false" type="button">
                    Inscription
                </button>
                <div class="tab-indicator"></div>
            </div>

            <!-- Conteneur des formulaires -->
            <div class="forms-slider">
                <!-- FORMULAIRE CONNEXION -->
                <form id="login-form" class="auth-form active" novalidate>
                    <div class="input-group">
                        <label for="login-email">Adresse email</label>
                        <div class="input-field">
                            <span class="field-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                            </span>
                            <input type="email" id="login-email" placeholder="nom@exemple.com" required autocomplete="email">
                        </div>
                        <span class="error-msg" id="login-email-error"></span>
                    </div>

                    <div class="input-group">
                        <div class="label-wrapper">
                            <label for="login-password">Mot de passe</label>
                            <a href="#" class="forgot-link" id="forgot-password">Mot de passe oublié ?</a>
                        </div>
                        <div class="input-field">
                            <span class="field-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </span>
                            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
                            <button type="button" class="toggle-password" aria-label="Afficher ou masquer le mot de passe">
                                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="error-msg" id="login-password-error"></span>
                    </div>

                    <div class="checkbox-group">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="remember-me">
                            <span class="checkmark"></span>
                            Se souvenir de moi
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Se connecter</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>

                <!-- FORMULAIRE INSCRIPTION -->
                <form id="register-form" class="auth-form" novalidate>
                    <div class="input-group">
                        <label for="register-name">Nom complet</label>
                        <div class="input-field">
                            <span class="field-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                    <circle cx="12" cy="7" r="4"/>
                                </svg>
                            </span>
                            <input type="text" id="register-name" placeholder="ex. Alex Dupont" required autocomplete="name">
                        </div>
                        <span class="error-msg" id="register-name-error"></span>
                    </div>

                    <div class="input-group">
                        <label for="register-email">Adresse email</label>
                        <div class="input-field">
                            <span class="field-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                            </span>
                            <input type="email" id="register-email" placeholder="nom@exemple.com" required autocomplete="email">
                        </div>
                        <span class="error-msg" id="register-email-error"></span>
                    </div>

                    <div class="input-group">
                        <label for="register-password">Mot de passe</label>
                        <div class="input-field">
                            <span class="field-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                            </span>
                            <input type="password" id="register-password" placeholder="8+ caractères requis" required autocomplete="new-password">
                            <button type="button" class="toggle-password" aria-label="Afficher ou masquer le mot de passe">
                                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="eye-closed hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <!-- Jauge de complexité mot de passe -->
                        <div class="password-strength-container">
                            <div class="strength-bar-bg">
                                <div class="strength-bar-fill" id="strength-bar"></div>
                            </div>
                            <span class="strength-text" id="strength-text">Niveau de sécurité</span>
                        </div>
                        <span class="error-msg" id="register-password-error"></span>
                    </div>

                    <div class="input-group">
                        <label for="register-confirm-password">Confirmer le mot de passe</label>
                        <div class="input-field">
                            <span class="field-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                            </span>
                            <input type="password" id="register-confirm-password" placeholder="Retapez le mot de passe" required autocomplete="new-password">
                        </div>
                        <span class="error-msg" id="register-confirm-error"></span>
                    </div>

                    <div class="checkbox-group">
                        <label class="custom-checkbox">
                            <input type="checkbox" id="terms" required>
                            <span class="checkmark"></span>
                            <span>J'accepte les <a href="#">Conditions d'utilisation</a></span>
                        </label>
                        <span class="error-msg" id="terms-error"></span>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span>Créer mon compte</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </form>
            </div>

            <!-- Séparateur tiers -->
            <div class="auth-divider">
                <span>ou continuer avec</span>
            </div>

            <div class="social-auth">
                <button type="button" class="social-btn" id="social-google">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="social-btn" id="social-github">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                    </svg>
                    GitHub
                </button>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="toast" class="toast">
            <span class="toast-icon"></span>
            <span class="toast-message" id="toast-text"></span>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
